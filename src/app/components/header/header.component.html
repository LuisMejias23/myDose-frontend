<header
  class="w-full px-3 sm:px-6 py-4 flex justify-between items-center fixed top-0 sm:top-4 left-0 sm:left-1/2 sm:-translate-x-1/2 z-50"
>
  <!-- Contenedor del Logo (Izquierda) -->
  <div class="bg-white/90 backdrop-blur-md rounded-full shadow-lg p-2 sm:p-3">
    <div class="flex items-center space-x-2">
      <!-- Título de la App (Siempre visible) -->
      <a
        [routerLink]="['/']"
        class="text-lg sm:text-xl font-bold text-blue-700 hover:text-blue-500 transition-colors"
        >MyDose</a
      >
      <!-- Enlace Home (Oculto en móvil, visible en sm:) -->
      <a
        [routerLink]="['/']"
        class="text-gray-600 hover:text-blue-500 transition-colors hidden sm:inline text-sm"
        >Home</a
      >
    </div>
  </div>

  <!-- Navegación y Acciones (Derecha) -->
  <nav class="ml-auto flex items-center">
    @if (!isLoggedIn()) {
    <a
      [routerLink]="['/login']"
      class="bg-blue-600 text-white font-semibold py-2 px-3 sm:px-4 text-sm rounded-full shadow hover:bg-blue-700 transition-colors"
    >
      Login
    </a>
    } @else {
    <!-- Contenedor para botones de usuario: Espaciado más compacto (space-x-2) -->
    <div
      class="flex items-center space-x-2 bg-white/90 backdrop-blur-md rounded-full shadow-lg p-1 sm:p-2"
    >
      <!-- Nombre de Usuario: Oculto en móviles muy pequeños (xs:inline) -->
      <span
        class="text-blue-700 font-semibold px-1 text-xs hidden xs:inline sm:text-sm"
        >Hola, {{ loggedInUsername() }}
      </span>

      <button
        (click)="requestNotif()"
        class="bg-green-600 text-white font-semibold py-2 px-3 text-xs sm:text-sm rounded-full shadow hover:bg-green-700 transition-colors"
      >
        <!-- Texto corto en móvil -->
        <span class="hidden sm:inline">Notificaciones</span>
        <!-- Icono de campana en móvil -->
        <svg
          class="w-4 h-4 sm:hidden"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.87 6.13 6 8.36 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v2a3 3 0 11-6 0v-2m6 0H9"
          ></path>
        </svg>
      </button>

      <button
        (click)="logout()"
        class="bg-blue-600 text-white font-semibold py-2 px-3 text-xs sm:text-sm rounded-full shadow hover:bg-blue-700 transition-colors"
      >
        Logout
      </button>
    </div>
    }
  </nav>
</header>
